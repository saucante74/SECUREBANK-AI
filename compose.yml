services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      RAG_CORPUS_PATH: /app/data/rag_integration_corpus.json
      USER_DATABASE_PATH: /app/runtime/users.sqlite3
    volumes:
      - securebank_users:/app/runtime
    depends_on:
      - qdrant
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
  securebank_users:
