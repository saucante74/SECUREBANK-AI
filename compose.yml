services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      AUTH_TRUSTED_ORIGINS: http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080
      QDRANT_URL: http://qdrant:6333
      RAG_CORPUS_PATH: /app/data/rag_integration_corpus.json
      USER_DATABASE_PATH: /app/runtime/users.sqlite3
      LANGFUSE_HOST: http://langfuse-web:3000
    volumes:
      - securebank_users:/app/runtime
      - ./backend/benchmark_results:/app/benchmark_results:ro
    depends_on:
      - qdrant
    networks:
      - default
      - securebank-observability
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
  securebank_users:

networks:
  securebank-observability:
    external: true
